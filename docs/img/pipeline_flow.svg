<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 582" role="img"
     aria-label="Masking pipeline, left to right. Input: one image or document. Four parallel detector lanes, each FIND then DECIDE: Logos — Grounding DINO finds logo-shaped boxes, then a flat-fill + CLIP gate keeps real brand marks (own logo allowlisted). Faces — YuNet finds faces, padded ~15% and blurred. Text/PII — ai_parse_document reads text elements, which are split into per-line boxes so that regex + a Claude classifier mask only the sensitive data fields (contact lines, captions, IDs) while keeping the narrative and boilerplate. Sensitive items (optional, off by default) — Claude vision finds in-image PII and objects and returns only the sensitive ones, falling back to Grounding DINO open-vocab. All lanes MERGE onto one aligned coordinate frame, then OUTPUT a non-destructive labelled overlay and a redacted copy (faces blurred; logos, text and items blacked).">
  <title>Text &amp; Image Masking — pipeline overview</title>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6b7480"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1238" height="580" rx="14" fill="#ffffff" stroke="#e3e7ee" stroke-width="1.5"/>

  <!-- ── numbered stage headers ─────────────────────────────────────────────── -->
  <text x="365"  y="40" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#3d4b5e">① FIND — where might it be?</text>
  <text x="745"  y="40" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#3d4b5e">② DECIDE — what to mask?</text>
  <text x="970"  y="40" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#3d4b5e">③ MERGE</text>
  <text x="1125" y="40" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#3d4b5e">④ OUTPUT</text>
  <line x1="24" y1="52" x2="1216" y2="52" stroke="#eef1f5" stroke-width="1.5"/>

  <!-- ── INPUT (spans the lanes) ────────────────────────────────────────────── -->
  <rect x="24" y="108" width="140" height="400" rx="10" fill="#eef1f5" stroke="#3d4b5e" stroke-width="1.5"/>
  <text x="94" y="290" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1f2733">INPUT</text>
  <text x="94" y="312" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6472">one image</text>
  <text x="94" y="328" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6472">or document</text>
  <text x="94" y="350" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10" fill="#8a94a2">PDF · PNG · JPG</text>
  <text x="94" y="364" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10" fill="#8a94a2">slide · scan</text>

  <!-- input → each lane -->
  <line x1="164" y1="146" x2="200" y2="146" stroke="#6b7480" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="164" y1="254" x2="200" y2="254" stroke="#6b7480" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="164" y1="362" x2="200" y2="362" stroke="#6b7480" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="164" y1="470" x2="200" y2="470" stroke="#6b7480" stroke-width="1.4" marker-end="url(#ah)"/>

  <!-- ══ LANE 1 · LOGOS (red) ══ y 108-184 ══ -->
  <rect x="200" y="108" width="330" height="76" rx="10" fill="#fbecea" stroke="#d0342c" stroke-width="1.5"/>
  <text x="216" y="130" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#d0342c" letter-spacing="0.6">LOGOS</text>
  <text x="216" y="150" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1f2733">Grounding DINO</text>
  <text x="216" y="168" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6472">find logo-shaped boxes (open-vocab)</text>
  <line x1="530" y1="146" x2="580" y2="146" stroke="#6b7480" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="580" y="108" width="330" height="76" rx="10" fill="#fbecea" stroke="#d0342c" stroke-width="1.5"/>
  <text x="596" y="136" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2733">flat-fill → CLIP gate</text>
  <text x="596" y="156" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6472">real brand mark? drop shapes/icons.</text>
  <text x="596" y="172" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6472">keep your own logo (allowlist)</text>

  <!-- ══ LANE 2 · FACES (blue) ══ y 216-292 ══ -->
  <rect x="200" y="216" width="330" height="76" rx="10" fill="#e9f2fa" stroke="#2277b8" stroke-width="1.5"/>
  <text x="216" y="238" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#2277b8" letter-spacing="0.6">FACES</text>
  <text x="216" y="258" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1f2733">YuNet</text>
  <text x="216" y="276" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6472">find faces (OpenCV DNN, local)</text>
  <line x1="530" y1="254" x2="580" y2="254" stroke="#6b7480" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="580" y="216" width="330" height="76" rx="10" fill="#e9f2fa" stroke="#2277b8" stroke-width="1.5"/>
  <text x="596" y="246" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2733">pad ~15% → blur</text>
  <text x="596" y="266" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6472">always masked · de-identify, not a box</text>

  <!-- ══ LANE 3 · TEXT / PII (gold) ══ y 324-400 ══ -->
  <rect x="200" y="324" width="330" height="76" rx="10" fill="#fbf1da" stroke="#b07d10" stroke-width="1.5"/>
  <text x="216" y="346" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#b07d10" letter-spacing="0.6">TEXT / PII</text>
  <text x="216" y="366" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1f2733">ai_parse_document</text>
  <text x="216" y="384" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6472">read text elements + boxes (docs)</text>
  <line x1="530" y1="362" x2="580" y2="362" stroke="#6b7480" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="580" y="324" width="330" height="76" rx="10" fill="#fbf1da" stroke="#b07d10" stroke-width="1.5"/>
  <text x="596" y="350" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2733">split lines → regex + Claude</text>
  <text x="596" y="368" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6472">mask only the sensitive data fields —</text>
  <text x="596" y="384" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6472">keep the narrative &amp; boilerplate</text>

  <!-- ══ LANE 4 · SENSITIVE (orange, dashed = optional) ══ y 432-508 ══ -->
  <rect x="200" y="432" width="330" height="76" rx="10" fill="#fff3e6" stroke="#d9730a" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="216" y="454" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#d9730a" letter-spacing="0.6">SENSITIVE ITEMS · OPTIONAL</text>
  <text x="216" y="474" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1f2733">Claude vision</text>
  <text x="216" y="492" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6472">find in-image PII + items (IDs, cards, screens)</text>
  <line x1="530" y1="470" x2="580" y2="470" stroke="#6b7480" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="580" y="432" width="330" height="76" rx="10" fill="#fff3e6" stroke="#d9730a" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="596" y="462" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2733">selective — reads &amp; judges</text>
  <text x="596" y="482" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5b6472">returns only sensitive regions</text>
  <text x="596" y="498" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-style="italic" fill="#9a6a30">fallback: Grounding DINO open-vocab</text>

  <!-- lanes → merge -->
  <line x1="910" y1="146" x2="938" y2="146" stroke="#6b7480" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="910" y1="254" x2="938" y2="254" stroke="#6b7480" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="910" y1="362" x2="938" y2="362" stroke="#6b7480" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="910" y1="470" x2="938" y2="470" stroke="#6b7480" stroke-width="1.4" marker-end="url(#ah)"/>

  <!-- ── MERGE bar ──────────────────────────────────────────────────────────── -->
  <rect x="938" y="108" width="66" height="400" rx="10" fill="#eef1f5" stroke="#3d4b5e" stroke-width="1.5"/>
  <text x="971" y="296" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#1f2733">align</text>
  <text x="971" y="312" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#1f2733">boxes</text>
  <text x="971" y="330" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="9.5" fill="#5b6472">clip·pad</text>
  <text x="971" y="343" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="9.5" fill="#5b6472">NMS</text>

  <!-- merge → outputs -->
  <line x1="1004" y1="308" x2="1030" y2="200" stroke="#6b7480" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="1004" y1="308" x2="1030" y2="360" stroke="#6b7480" stroke-width="1.4" marker-end="url(#ah)"/>

  <!-- ── OUTPUTS ────────────────────────────────────────────────────────────── -->
  <rect x="1030" y="150" width="186" height="96" rx="10" fill="#eef1f5" stroke="#4a5a6a" stroke-width="1.5"/>
  <text x="1123" y="176" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2733">Debug overlay</text>
  <text x="1123" y="196" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#5b6472">labelled boxes · non-destructive</text>
  <text x="1123" y="228" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#3d4b5e">*_overlay.jpg</text>

  <rect x="1030" y="300" width="186" height="128" rx="10" fill="#eceef1" stroke="#222831" stroke-width="1.5"/>
  <text x="1123" y="326" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2733">Redacted copy</text>
  <text x="1123" y="348" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#5b6472">faces → blur</text>
  <text x="1123" y="364" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#5b6472">logos · text · items → black</text>
  <text x="1123" y="396" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#1f2733">*_masked.jpg</text>

  <!-- footnote -->
  <text x="24" y="548" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#8a94a2">Lanes run in parallel and toggle independently. Default on: logos · faces. Off by default: text/PII (needs Databricks) · sensitive items (needs a multimodal Claude endpoint).</text>
</svg>
